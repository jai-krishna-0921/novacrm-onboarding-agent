[project]
name = "onboarding-agent"
version = "0.1.0"
description = "NovaCRM onboarding automation: intake + communication agents (Rocketlane FDE take-home)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.8.0",
    "fastapi>=0.162.4",
    "google-api-python-client>=2.202.0",
    "google-auth>=2.62.2",
    "google-auth-oauthlib>=1.5.0",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.7.10",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg[binary,pool]>=3.3.8",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "retell-sdk>=6.2.19",
    "slack-sdk>=3.46.0",
    "sqlalchemy>=2",
    "structlog>=26.1.0",
    "tenacity>=9.2.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --disable-socket --allow-unix-socket -m 'not stress'"
markers = ["stress: slow load/chaos suite (tests/stress); run with `uv run pytest -m stress`"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 125
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["SIM108"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-socket>=0.8.1",
    "pytest-xdist>=3.8.0",
    "respx>=0.23.1",
    "ruff>=0.17.4",
]
